version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: pes_postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: pes_local
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Schema is applied by `prisma db push` (see package.json: dev:local),
      # not by init SQL here — backup.sql predates most current models and
      # would leave the database out of sync with prisma/schema.prisma.

  # Optional/Full-stack configuration:
  # web:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: pes_web_app
  #   restart: always
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     - DATABASE_URL=postgresql://postgres:admin@db:5432/pes_local
  #     - JWT_SECRET=fallback-secret-change-in-production
  #     # Add other required environment variables from .env.local here
  #   depends_on:
  #     - db

volumes:
  postgres_data:
